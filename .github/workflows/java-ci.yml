name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile exercises
        shell: bash
        run: |
          set -euo pipefail

          # 各课次声明与目录同名的 package，可逐课整课编译至同一输出根
          for dir in lesson*/; do
            lesson="${dir%/}"
            echo "::group::Compiling ${lesson}"
            javac -encoding UTF-8 -d out "${lesson}"/*.java
            echo "::endgroup::"
          done
